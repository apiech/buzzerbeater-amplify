version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - if [ "${MATCH_DATA_PLANE_SOURCE:-local}" = "external" ]; then npm run sync:match-data-plane; fi
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - if [ "${MATCH_DATA_PLANE_SOURCE:-local}" = "external" ]; then npm run sync:match-data-plane; fi
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
